# Sliplane Configuration for Khoj AI Deployment
# This file optimizes the deployment for Sliplane's infrastructure

services:
  # Main Khoj server - this will be the public-facing service
  server:
    build: .
    image: ghcr.io/khoj-ai/khoj:latest
    ports:
      - "42110:42110"
    depends_on:
      - database
    environment:
      # Database configuration
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      
      # Khoj configuration - will be set via Sliplane UI
      - KHOJ_DJANGO_SECRET_KEY=${KHOJ_DJANGO_SECRET_KEY}
      - KHOJ_DEBUG=${KHOJ_DEBUG:-False}
      - KHOJ_ADMIN_EMAIL=${KHOJ_ADMIN_EMAIL}
      - KHOJ_ADMIN_PASSWORD=${KHOJ_ADMIN_PASSWORD}
      
      # AI Model APIs
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Optional features
      - KHOJ_OPERATOR_ENABLED=${KHOJ_OPERATOR_ENABLED:-False}
      - SERPER_DEV_API_KEY=${SERPER_DEV_API_KEY}
      - OLOSTEP_API_KEY=${OLOSTEP_API_KEY}
      - E2B_API_KEY=${E2B_API_KEY}
      - KHOJ_TELEMETRY_DISABLE=${KHOJ_TELEMETRY_DISABLE:-True}
      
      # Sliplane-specific
      - KHOJ_NO_HTTPS=${KHOJ_NO_HTTPS:-True}
      - KHOJ_DOMAIN=${KHOJ_DOMAIN}
      - KHOJ_ALLOWED_DOMAIN=${KHOJ_ALLOWED_DOMAIN}
      
    volumes:
      - khoj_config:/root/.khoj/
      - khoj_models:/root/.cache/torch/sentence_transformers
      - khoj_models:/root/.cache/huggingface
    restart: unless-stopped
    command: --host="0.0.0.0" --port=42110 -vv --non-interactive
    
    # Health check for Sliplane
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:42110/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL database with pgvector extension
  database:
    image: docker.io/pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - khoj_db:/var/lib/postgresql/data/
    restart: unless-stopped
    
    # Health check for database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  khoj_config:
  khoj_db:
  khoj_models:

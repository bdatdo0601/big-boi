type Reference
  @model
  @auth(
    rules: [
      { allow: groups, provider: userPools, groups: ["BigBoiSuperAdmin"], operations: [read, create, update, delete] }
      { allow: owner, provider: userPools, operations: [read, create, update, delete] }
      { allow: private, provider: identityPool, operations: [read, create, update] }
      { allow: public, operations: [read] }
      { allow: public, provider: identityPool, operations: [read] }
    ]
  )
{
  id: ID!
  title: String!
  url: String
  description: String
  extraData: AWSJSON
  type: String
    @index(name: "byUpdatedAt", queryField: "ReferenceByUpdatedAt", sortKeyFields: ["updatedAt"])
    @index(name: "byClickCount", queryField: "ReferenceByClickCount", sortKeyFields: ["clickCount"])
  clickCount: Int
  updatedAt: AWSDateTime!
  tags: [String]
}

